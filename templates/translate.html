<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignSpeak</title>
    <link rel="stylesheet" href="../static/translate.css">
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">SignSpeak</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link active" href="/">Home</a>
                    <a class="nav-link" href="/translator">Translator</a>
                    <a class="nav-link" href="#features">Features</a>
                    <a class="nav-link" href="#about">About</a>
                    <a href="/get-started" class="btn btn-info">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <section class="panel" aria-labelledby="voice-to-sign-title">
        <h2 id="voice-to-sign-title">Voice to Sign Language</h2>
        <div class="sign-image-container" style="width: 100%; height: 260px;">
            <video 
                src="../static/animation.mp4" 
                autoplay
                loop
                style="border-radius: 0.5rem;">
        </div>
        <div class="voice-sign-language">
            <button type="button" class="mic-button">
                <i class="bi bi-mic-fill mic-icon"></i>
            </button>
            <select aria-label="Select language for voice input">
                <option>English</option>
                <option>Spanish</option>
                <option>French</option>
                <option>Hindi</option>
            </select>
        </div>
        <textarea placeholder="Text Output" rows="3" readonly></textarea>
        <div class="button-group">
            <button type="button" class="btn btn-info">Start</button>
            <button type="button">Stop</button>
        </div>
    </section>

    <section class="panel" aria-labelledby="sign-to-text-title">
        <h2 id="sign-to-text-title">Sign Language to Text</h2>
        <div class="sign-image-container" style="width: 100%; height: 260px;">
            <video id="webcam" autoplay playsinline style="width: 500px; border: 2px solid black; border-radius: 8px;"></video>
        </div>
        <textarea aria-label="Detected text from sign language input" placeholder="Detected Text" rows="5" readonly></textarea>
        <button class="download-button" type="button">Download Transcript</button>
    </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="f-info">
            <div class="f-info-social">
                <i class="fa-brands fa-square-facebook"></i>
                <i class="fa-brands fa-square-twitter"></i>
                <i class="fa-brands fa-square-instagram"></i>
            </div>
            <div class="f-info-brand">&copy; SignSpeak Private Limited</div>
            <div class="f-info-links">
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        const animation = el.getAttribute("data-animate");
                        const delay = el.getAttribute("data-delay") || "0s";

                        el.classList.add("animate__animated", animation);
                        el.style.setProperty("--animate-delay", delay);

                        observer.unobserve(el); // run only once
                    }
                });
            }, { threshold: 0.2 });

            document.querySelectorAll(".animate-on-scroll").forEach(el => {
                observer.observe(el);
            });
        });
        </script>
        <script>
        // Get the video element
        const video = document.getElementById("webcam");

        // Ask for webcam access
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => {
                video.srcObject = stream; // Set webcam stream to video element
            })
            .catch(error => {
                console.error("Error accessing webcam:", error);
                alert("Could not access the webcam. Please allow permissions.");
            });
    </script>
</body>
</html>
